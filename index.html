        function renderQuiz() {
            const container = document.getElementById("quiz-container");
            quizData.forEach((item, index) => {
                let optionsHtml = '';
                item.a.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <li>
                            <label id="label-${index}-${optIndex}">
                                <input type="radio" name="question-${index}" value="${optIndex}">
                                ${opt}
                            </label>
                        </li>
                    `;
                });

                const card = document.createElement("div");
                card.className = "question-card";
                card.innerHTML = `
                    <div class="question-title">${item.q}</div>
                    <ul class="options">${optionsHtml}</ul>
                    <div class="explanation" id="exp-${index}">
                        <strong>Giải thích:</strong> ${item.exp}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function checkAnswers() {
            let score = 0;
            quizData.forEach((item, index) => {
                const selectedOption = document.querySelector(`input[name="question-${index}"]:checked`);
                const expBox = document.getElementById(`exp-${index}`);
                expBox.style.display = "block";

                // Clear previous styles
                item.a.forEach((_, optIndex) => {
                    const label = document.getElementById(`label-${index}-${optIndex}`);
                    label.classList.remove("correct", "incorrect");
                });

                // Highlight correct option
                const correctLabel = document.getElementById(`label-${index}-${item.correct}`);
                correctLabel.classList.add("correct");

                if (selectedOption) {
                    const userChoice = parseInt(selectedOption.value);
                    if (userChoice === item.correct) {
                        score++;
                    } else {
                        const userLabel = document.getElementById(`label-${index}-${userChoice}`);
                        userLabel.classList.add("incorrect");
                    }
                }
            });

            const resultBox = document.getElementById("result-box");
            resultBox.style.display = "block";
            resultBox.innerHTML = `Bạn đã hoàn thành! Kết quả: <strong>${score} / ${quizData.length}</strong> câu đúng.`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize Quiz on page load
        window.onload = renderQuiz;
    </script>
